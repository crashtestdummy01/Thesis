[workspace]
authors = ["Daniel San José Pro <42489409+danielsanjosepro@users.noreply.github.com>"]
name = "franka_ros2_pixi"
version = "0.1.0"
channels = ["https://fast.prefix.dev/conda-forge"]
platforms = ["linux-64"]

[activation]
scripts = ["scripts/set_ros_env.sh", "install/setup.bash"]

[dependencies]
python = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
pinocchio = "*"
pure-python-adb = ">=0.3.0.dev0,<0.4"
pyqtgraph = ">=0.13.7,<0.14"
libtmux = ">=0.46.2,<0.47"
omegaconf = "*"
git = "*"
mujoco = ">=3.2.7,<4"

[tasks]
my_setup = "bash scripts/setup.sh"
build = "colcon build --symlink-install --parallel-workers 1 --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -Wno-dev"
clean = "rm -rf build install log"
clean-build = [{ task = "clean" }, { task = "build" }]
setup = { depends-on = ["my_setup", "build"] }
franka = "ros2 launch scripts/launch/franka.launch.py"
main = "ros2 launch scripts/launch/main.launch.py"

[target.linux.dependencies]
libgl-devel = "*"
libcap = "*"
poco = "*"

[environments]
humble = { features = ["humble", "dev", "extra"] }
jazzy = { features = ["jazzy", "dev", "extra"] }

# humble
[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-joint-state-publisher = "*"
ros-humble-rmw-zenoh-cpp = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosbag2-storage-mcap = "*"
rosdep = "*"
libstdcxx-ng = "*"
setuptools = ">=65.0.0,<70.0.0"
ros-humble-moveit = "*"
ros-humble-plotjuggler-ros = ">=2.1.0,<3"
ros-humble-rviz2 = "*"
ros-humble-foxglove-bridge= "*"
numpy = "*"
libopengl = "*"
libegl-devel = "*"

[feature.humble.pypi-dependencies]
python-statemachine = ">=3.2.1, <4"

# jazzy
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-joint-state-publisher = "*"
colcon-common-extensions = "*"
ros-jazzy-rmw-zenoh-cpp = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
rosdep = "*"
ros-jazzy-moveit = "*"
# scipy = "*"

[feature.dev.pypi-dependencies]
ruff= "*"
bumpver = "*"
build = "*"
twine = "*"
pre-commit = "*"
pytest = "*"  # for testing

[feature.extra.pypi-dependencies]
rich = "*"  # For nice prints
matplotlib = "*"  # to do some plots

